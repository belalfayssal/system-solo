name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          mkdir -p /tmp/keep
          cp main.dart pubspec.yaml patch_android.py /tmp/keep/
          flutter create --org com.belal --project-name system_solo --platforms android .
          cp /tmp/keep/main.dart lib/main.dart
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          rm -rf test
          python3 /tmp/keep/patch_android.py
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: system-solo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
